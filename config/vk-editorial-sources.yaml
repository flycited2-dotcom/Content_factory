topics:
  - id: clean-ac-filters
    category: air_conditioners
    content_type: service
    title: Как часто очищать фильтры кондиционера
    hook: Кондиционер стал хуже холодить, шумит громче обычного, а из решётки тянет сыростью. Чаще всего это не поломка.
    intro: Забитый фильтр мешает блоку прогонять воздух. Кондиционер работает дольше и громче ради того же результата, а пыль возвращается в комнату.
    offer: Промывка фильтров занимает десять минут и не стоит ничего — её реально сделать самому по чек-листу выше.
    cta: Если фильтры давно не очищались или кондиционер пахнет, шумит либо стал хуже охлаждать — запишитесь на диагностику и обслуживание.
    visual: "Фотореалистичная технически правдоподобная сцена: внутренний блок настенного кондиционера установлен штатно под потолком, нижняя кромка примерно 2,2–2,4 м от пола; взрослый мастер стоит обеими ногами на устойчивой профессиональной стремянке и аккуратно снимает сетчатые фильтры. В широком кадре видны пол, все опоры стремянки, потолок и реальное соотношение роста человека, высоты установки и размера блока. Запрещены работа с колен, дотягивание с пола, тумба или мебель вместо стремянки, зависание, искажённая анатомия и нереальный масштаб."
    facts:
      - id: clean-every-two-weeks
        text: В руководстве Daikin рекомендуется очищать воздушные фильтры раз в две недели.
        source: daikin_filter_guide
      - id: dry-in-shade
        text: После промывки фильтры следует просушить в тени.
        source: daikin_filter_guide
      - id: power-off-before-cleaning
        text: Перед снятием фильтров кондиционер нужно выключить и отключить от электропитания.
        source: daichi_service_manual
      - id: remove-dust-first
        text: Сначала с фильтров удаляют пыль, а при сильном загрязнении промывают их водой.
        source: daikin_filter_guide
      - id: no-direct-heat
        text: Для сушки нельзя использовать открытый огонь или горячий воздух бытового фена.
        source: daikin_filter_guide
  - id: end-of-season-ac
    category: air_conditioners
    content_type: service
    title: Что сделать с кондиционером в конце сезона
    hook: "Сезон закончился, кондиционер выключили — и забыли до мая. Весной он встречает хозяев запахом и подтёками."
    intro: "Внутри блока за лето копятся влага и пыль. Оставить как есть — и к весне это превращается в запах, а иногда и в течь."
    offer: "Консервация занимает один вечер и делается своими руками — по чек-листу выше."
    cta: Нужна диагностика или обслуживание — напишите в сообщения сообщества.
    visual: "Фотореалистичная технически правдоподобная сцена сезонного обслуживания: внутренний блок настенного кондиционера шириной около 90 см установлен штатно под потолком, нижняя кромка примерно 2,2–2,4 м от пола; взрослый сервисный мастер стоит обеими ногами на устойчивой профессиональной стремянке и работает с открытым блоком. В широком кадре полностью видны пол, все четыре опоры стремянки, потолок и безопасная рабочая поза; чистые фильтры и инструмент размещены в лотке стремянки или на полу вне прохода. Запрещены работа с колен, дотягивание с пола, мебель вместо стремянки, зависание, искажённая анатомия и нереальный масштаб."
    facts:
      - id: wash-filters
        text: В конце сезона руководство предписывает промыть или заменить фильтры.
        source: daichi_service_manual
      - id: dry-inside
        text: Перед длительным перерывом внутреннюю часть рекомендуют просушить работой в режиме вентиляции.
        source: daichi_service_manual
      - id: disconnect-after-drying
        text: После просушки и перед чисткой оборудование нужно выключить и отключить от электропитания.
        source: daichi_service_manual
      - id: clean-unit-surfaces
        text: Корпус внутреннего блока очищают мягкой тканью без агрессивных и летучих жидкостей.
        source: daichi_service_manual
      - id: inspect-before-next-season
        text: Если есть посторонний шум, запах, течь или ошибка, до следующего сезона нужна диагностика специалиста.
        source: daichi_service_manual
  - id: inverter-benefits
    category: air_conditioners
    content_type: comparison
    title: Инверторный или обычный кондиционер
    hook: "Один кондиционер держит температуру ровно, второй то морозит, то отключается. Разница не в цене, а в том, как работает компрессор."
    intro: "Обычный компрессор умеет только включиться и выключиться. Инверторный меняет обороты и держит температуру без рывков."
    offer: "Инвертор оправдан там, где техника работает часами каждый день. Для дачи, куда приезжают на пару недель, разница может не окупиться."
    cta: Подберём решение под режим использования помещения и бюджет.
    visual: Фотореалистичный современный интерьер с настенным кондиционером, спокойная комфортная атмосфера, на столе точный бытовой термометр; визуальный акцент на стабильном комфорте без схем и надписей.
    facts:
      - id: inverter-precision
        text: Для серии HeatForce заявлено поддержание заданной температуры с отклонением ±0,5 °C.
        source: daichi_heatforce
      - id: inverter-dc-vs-ac
        text: Производитель заявляет энергоэффективность на 20 процентов выше по сравнению с обычными инверторами переменного тока.
        source: daichi_heatforce
      - id: inverter-seer-scop
        text: Сезонные показатели серии достигают SEER 9,2 на охлаждение и SCOP 4,6 на обогрев.
        source: daichi_heatforce
      - id: inverter-cooling-range
        text: Рабочий диапазон на охлаждение заявлен от −15 до +50 °C.
        source: daichi_heatforce
      - id: inverter-shoulder-season
        text: В межсезонье предусмотрен нагрев до 8 °C в режиме поддержания комфортных условий.
        source: daichi_heatforce
  - id: multi-split-rooms
    category: air_conditioners
    content_type: comparison
    title: Когда стоит рассмотреть мульти-сплит-систему
    hook: "Три комнаты — три наружных блока на фасаде? Не обязательно."
    intro: "Мульти-сплит — это один наружный блок на несколько внутренних. Фасад остаётся чистым, но трассы надо продумать заранее."
    offer: "Считать это надо до ремонта: трассы закладывают в стены, потом переигрывать дорого."
    cta: Перед выбором посчитаем помещения и проверим возможную трассировку.
    visual: "Фотореалистичный архитектурный разрез двухэтажного жилого дома: передняя стена полностью убрана, как у кукольного домика, поэтому одновременно видны внутренности трёх разных жилых комнат и фасад сбоку. В каждой из трёх комнат под потолком висит по одному настенному внутреннему блоку кондиционера, нижняя кромка примерно 2,2–2,4 м от пола; комнаты обставлены и различимы между собой. Снаружи у стены на уровне земли стоит один наружный блок, от которого идёт единственный общий пучок трасс, уходящий внутрь конструкции стены. Композиция обязана показывать связь: один наружный блок обслуживает несколько внутренних. Запрещены вид только фасада без разреза, белые декоративные короба трасс по наружной стене, инфографика, стрелки, схемы, подписи, текст и логотипы."
    facts:
      - id: one-outdoor-many-indoor
        text: Мульти-сплит-система использует один наружный блок и несколько внутренних.
        source: daichi_multi
      - id: multi-zone
        text: Daichi позиционирует такое решение для многокомнатных и многозонных помещений.
        source: daichi_multi
      - id: indoor-units-selection
        text: Количество и тип внутренних блоков подбирают отдельно под каждое обслуживаемое помещение.
        source: daichi_multi
  - id: recuperator-purpose
    category: recuperators
    content_type: useful
    title: Что делает рекуператор в системе вентиляции
    hook: "Приточка гонит свежий воздух — и зимой вместе с ним в дом заходит холод. Счёт за отопление это замечает."
    intro: "Рекуператор не заменяет вентиляцию, а встраивается в неё и возвращает тепло, которое иначе ушло бы на улицу."
    offer: "Рекуператор ставят в ту же систему, и подбирают его вместе с воздухообменом, а не отдельной покупкой."
    cta: Для корректного подбора нужны параметры помещения и требуемый воздухообмен.
    visual: Фотореалистичный монтажник обслуживает компактную приточно-вытяжную установку с пластинчатым рекуператором в аккуратном техническом помещении частного дома; корпус открыт, теплообменник хорошо виден.
    facts:
      - id: heat-recovery
        text: Пластинчатый рекуператор утилизирует тепло или холод в системе вентиляции.
        source: breez_zrp
      - id: streams-separated
        text: В рекуператорах ZRP приточный и вытяжной воздушные потоки полностью разделены.
        source: breez_zrp
      - id: airflow-selection
        text: Типоразмер рекуператора выбирают по требуемому расходу воздуха и параметрам вентиляционной системы.
        source: breez_zrp
  - id: ventilation-selection
    category: ventilation
    content_type: useful
    title: Почему вентиляцию нельзя подбирать только по площади
    hook: Открыл окно — шум и пыль с улицы. Закрыл — к вечеру душно и голова тяжёлая. Знакомый выбор?
    intro: "Приточная вентиляция снимает его совсем: свежий воздух идёт при закрытых окнах. Но подобрать установку «по квадратным метрам» нельзя — площадь тут лишь одна из вводных."
    offer: Подбор укладывается в один разговор — нужны планировка, назначение комнат и сколько людей в них бывает.
    cta: Пришлите планировку и задачу — сформируем исходные данные для подбора.
    visual: Инженер по вентиляции изучает план жилого дома и выполняет замеры воздуха в современной комнате с помощью профессионального прибора; видны аккуратные потолочные вентиляционные решётки.
    facts:
      - id: operating-conditions
        text: Технический подбор учитывает условия эксплуатации объекта.
        source: breez_support
      - id: price-requirements
        text: При разработке решения также учитываются ценовые требования.
        source: breez_support
      - id: project-inputs
        text: Для технического подбора нужны назначение помещений, планировка и требуемые параметры воздухообмена.
        source: breez_support
  - id: professional-selection
    category: climate
    content_type: trust
    title: Что входит в профессиональный подбор климатической техники
    hook: "Продавец спрашивает «сколько квадратов?» и называет модель. На этом подбор заканчивается, а проблемы начинаются после монтажа."
    intro: "Площадь — одна цифра из десятка. Есть ещё остекление, этаж, сколько людей и техники в комнате и как ей пользуются."
    offer: "Нормальный подбор начинается с задачи: что за помещение, как им пользуются и какой результат нужен."
    cta: Опишите помещение и желаемый результат — предложим подходящие варианты.
    visual: Опытный инженер по климатической технике обсуждает проект с владельцем дома за столом с планировкой помещений; в интерьере видны кондиционер и вентиляционная решётка, естественная деловая сцена.
    facts:
      - id: complex-solutions
        text: Инженерная поддержка включает разработку комплексных решений для объектов.
        source: breez_support
      - id: non-standard
        text: Официальная техническая поддержка отдельно учитывает сложные и нестандартные проекты.
        source: breez_support
      - id: source-data-first
        text: До выбора модели инженер собирает исходные данные об объекте, режиме эксплуатации и ограничениях проекта.
        source: breez_support
  - id: ups-runtime
    category: ups
    content_type: useful
    title: От чего зависит время работы ИБП
    hook: "Свет погас — и котёл встал вместе с ним. ИБП вроде есть, но хватило его на десять минут вместо обещанного часа."
    intro: "Автономия зависит не от ёмкости батареи самой по себе, а от того, сколько ватт вы к ней подключили."
    offer: "Время автономии считают от реальной нагрузки, а не от надписи на коробке."
    cta: Для подбора пришлите список оборудования и его потребляемую мощность.
    visual: Фотореалистичный источник бесперебойного питания без бренда питает домашний котёл и сетевое оборудование во время отключения электроэнергии; аккуратная техническая зона частного дома, реалистичные кабели.
    facts:
      - id: runtime-load
        text: POWERMAN указывает, что время автономной работы зависит от подключённой нагрузки.
        source: powerman_brick
      - id: protect-disturbances
        text: ИБП BRICK рассчитан на работу при отключении сети и отклонениях сетевого напряжения.
        source: powerman_brick
      - id: battery-and-load
        text: Расчёт автономии выполняют по мощности подключённой нагрузки и характеристикам аккумулятора.
        source: powerman_brick
  - id: online-ups
    category: ups
    content_type: comparison
    title: Когда нужен ИБП класса Online
    hook: "Обычный ИБП выручит компьютер. Но не всякий котёл или сервер спокойно переживёт момент переключения."
    intro: "Обычный ИБП переключается на батарею за доли секунды. Компьютер этого не заметит, чувствительная автоматика — уже да."
    offer: "Online берут туда, где перерыв питания недопустим совсем. Для остального он избыточен и заметно дороже."
    cta: Проверим тип нагрузки, мощность и требуемое время автономной работы.
    visual: Фотореалистичная серверная стойка малого бизнеса с аккуратно установленным источником бесперебойного питания класса Online без брендинга; инженер проверяет показатели оборудования, естественное техническое освещение.
    facts:
      - id: zero-transfer
        text: Для POWERMAN ONLINE заявлено нулевое время перехода с сети на батарею.
        source: powerman_online
      - id: demanding-equipment
        text: Серия ONLINE предназначена для серверов, автоматики и другого требовательного оборудования.
        source: powerman_online
      - id: continuous-conversion
        text: ИБП класса Online постоянно преобразует питание и изолирует нагрузку от основных сетевых искажений.
        source: powerman_online
  - id: stabilizer-measure-first
    category: stabilizers
    content_type: useful
    title: Почему стабилизатор нельзя выбирать без замеров напряжения
    hook: Свет моргает, техника щёлкает и перезагружается сама, а котёл уходит в ошибку. Стабилизатор это лечит — если выбран под вашу сеть, а не наугад.
    intro: Самая частая ошибка — взять по мощности приборов и не посмотреть, какое напряжение реально приходит на объект. Такой стабилизатор упрётся в предел в первый же вечер.
    offer: "Замеры не требуют специалиста: снимите минимум и максимум в разные часы, и подбор станет точным с первого раза."
    cta: Перед подбором зафиксируйте минимальное и максимальное напряжение в сети в разные часы.
    visual: Профессиональный электрик измеряет входное напряжение цифровым мультиметром у распределительного щита частного дома; рядом установлен настенный стабилизатор без бренда, безопасная и технически правдоподобная сцена.
    facts:
      - id: working-and-limit-range
        text: У стабилизатора различают рабочий и предельный диапазоны входного напряжения.
        source: shtyl_selection
      - id: measure-real-network
        text: Контрольные замеры помогают определить реальные отклонения напряжения на объекте.
        source: shtyl_selection
      - id: calculate-load
        text: Суммарную мощность считают по всем одновременно работающим приборам с учётом пусковых токов.
        source: shtyl_selection
      - id: power-reserve
        text: К расчётной мощности обычно добавляют запас 20–30 процентов, чтобы стабилизатор не работал на пределе.
        source: shtyl_selection
      - id: installation-format
        text: Форм-фактор выбирают под место установки — настенный, напольный или стоечный — с учётом охлаждения и шума.
        source: shtyl_selection
  - id: stabilizer-range-and-power
    category: stabilizers
    content_type: comparison
    title: Почему одного широкого диапазона стабилизатора недостаточно
    hook: "На коробке написано «широкий диапазон» — и кажется, что вопрос закрыт. А у нижней границы стабилизатор отдаёт уже не всю мощность."
    intro: "Диапазон и мощность связаны: чем ниже входное напряжение, тем меньше стабилизатор отдаёт на выходе."
    offer: "Смотрите не рекламную цифру на упаковке, а сколько модель реально тянет при вашем напряжении."
    cta: Сверяйте диапазон не только с рекламной цифрой, но и с графиком нагрузки конкретной модели.
    visual: Фотореалистичный электрик сравнивает показания входного напряжения и нагрузки на настенном стабилизаторе без бренда в техническом помещении; реалистичный дисплей без читаемых надписей и безопасный монтаж.
    facts:
      - id: is20000-limit-range
        text: Для модели Штиль IS20000 указан предельный входной диапазон 90–310 В.
        source: shtyl_is20000
      - id: is20000-full-load-range
        text: Полная нагрузка для этой модели доступна при входном напряжении 165–310 В, а ниже выходная мощность ограничивается.
        source: shtyl_is20000
      - id: range-not-only-criterion
        text: Кроме диапазона нужно сопоставить активную и полную мощность нагрузки, пусковые токи и условия установки.
        source: shtyl_selection
  - id: stabilizer-ranges-differ
    category: stabilizers
    content_type: comparison
    title: Почему диапазон напряжения нужно проверять у каждой модели
    hook: "Два стабилизатора одной мощности и почти одной цены. Один вашу сеть вытянет, другой уйдёт в защиту."
    intro: "Даже внутри одной категории модели рассчитаны на разные сети. Паспортный диапазон — это про конкретную модель, а не про класс."
    offer: "Категория «для дома» ничего не гарантирует — сверяйте паспорт конкретной модели с замерами на объекте."
    cta: Сопоставляйте паспортный диапазон модели с замерами на вашем объекте.
    visual: Фотореалистичная нейтральная витрина с двумя разными настенными стабилизаторами напряжения без брендов и надписей; рядом электрик держит прибор для измерения сети, естественная техническая сцена.
    facts:
      - id: powerman-range-example
        text: В официальном каталоге POWERMAN для разных серий указаны отличающиеся диапазоны входного напряжения.
        source: powerman_stabilizers
      - id: range-is-model-specific
        text: Поэтому диапазон необходимо сверять по характеристикам конкретной модели, а не по типу устройства в целом.
        source: powerman_stabilizers
      - id: working-versus-limit
        text: Рабочий диапазон и предельный диапазон описывают разные режимы, поэтому их нельзя считать взаимозаменяемыми.
        source: shtyl_selection
  - id: heat-pump-cold-weather
    category: heat_pumps
    content_type: useful
    title: Что проверить перед выбором теплового насоса для обогрева
    hook: "«Инверторный, греет в мороз» — написано на витрине. В январе выясняется, что греет, но уже не столько, сколько нужно дому."
    intro: "Тепловой насос греет, пока на улице не слишком холодно. Где проходит его граница — написано в характеристиках серии, а не на ценнике."
    offer: "Смотреть надо рабочий диапазон конкретной серии и теплопотери дома, а не слово «инвертор» в названии."
    cta: Сначала определите расчётную температуру региона и теплопотери помещения.
    visual: Фотореалистичный современный частный дом зимой, наружный блок воздушного теплового насоса работает у фасада, внутри через окно видна тёплая жилая комната; естественный снег и реалистичный монтаж.
    facts:
      - id: heatforce-air-to-air
        text: Серия HeatForce относится к тепловым насосам типа воздух–воздух.
        source: daichi_heatforce
      - id: heatforce-minus-thirty
        text: Для серии HeatForce производитель заявляет работу на обогрев при наружной температуре до −30 °C.
        source: daichi_heatforce
      - id: select-by-design-temperature
        text: При подборе нужно сопоставить рабочий диапазон конкретной серии с расчётной наружной температурой объекта.
        source: daichi_heatforce
      - id: match-heating-capacity
        text: Теплопроизводительность оборудования должна соответствовать теплопотерям помещения при расчётной температуре.
        source: daichi_heatforce
      - id: check-installation-conditions
        text: До выбора проверяют место наружного блока, допустимую длину трассы и возможность отвода конденсата.
        source: daichi_heatforce
  - id: stabilizer-accuracy-and-speed
    category: stabilizers
    content_type: comparison
    title: Точность и скорость стабилизатора важнее широкого диапазона
    hook: "Стабилизатор стоит, а лампы всё равно подмигивают и техника щёлкает. Значит, он либо неточный, либо медленный."
    intro: "Точность — насколько ровно прибор держит выходное напряжение. Скорость — как быстро он отвечает на скачок. Именно эти две цифры решают, защитит он технику или просто займёт место."
    offer: "В паспорте смотрите два параметра: точность в процентах и время срабатывания. Крупная цифра диапазона на коробке о качестве защиты не говорит."
    cta: Напишите, какую технику нужно защитить, — подберём стабилизатор по точности и скорости, а не по надписи на упаковке.
    visual: "Фотореалистичный кадр: настенный стабилизатор напряжения без узнаваемого бренда установлен в аккуратной технической зоне частного дома, на цифровом дисплее видны показания напряжения, рядом уходит проводка в щит. Спокойный дневной свет, без людей, без текста, надписей и логотипов."
    facts:
      - id: accuracy-gost-limit
        text: Точность стабилизации отражает максимально возможный перепад выходного напряжения, который по ГОСТу должен составлять не более 10 процентов от номинального значения.
        source: shtyl_selection
      - id: accuracy-typical-range
        text: Большинство стабилизаторов в зависимости от принципа работы имеют точность от 3 до 8 процентов.
        source: shtyl_selection
      - id: reaction-time-matters
        text: Чем дольше происходит срабатывание при изменении входного напряжения, тем опаснее это для электроприборов.
        source: shtyl_selection
  - id: stabilizer-beyond-power
    category: stabilizers
    content_type: useful
    title: Что смотрят при выборе стабилизатора кроме мощности
    hook: "Сложили мощности всех приборов, взяли стабилизатор с запасом — а он уходит в защиту, стоит включиться насосу."
    intro: "Мощность на шильдике — не вся правда. После неё смотрят ещё три вещи, и каждая из них способна испортить впечатление от покупки."
    offer: "Пусковые токи, КПД и тип охлаждения проверяют до заказа: переигрывать после установки дороже, особенно если стабилизатор стоит в жилой части дома."
    cta: Пришлите список техники, которую нужно запитать, — посчитаем нагрузку с учётом пусковых токов.
    visual: "Фотореалистичная сцена в техническом помещении частного дома: напольный стабилизатор напряжения без узнаваемого бренда стоит у стены с запасом свободного места вокруг корпуса, рядом виден распределительный щит и аккуратно уложенные кабели. Без людей, без текста, надписей и логотипов."
    facts:
      - id: startup-currents-exceed
        text: Отдельным категориям оборудования характерны высокие пусковые токи, превышающие штатные в несколько раз.
        source: shtyl_selection
      - id: efficiency-saves-energy
        text: Чем выше КПД стабилизатора, тем больше энергосбережение.
        source: shtyl_selection
      - id: convection-cooling-silent
        text: Конвекционная система охлаждения абсолютно бесшумна.
        source: shtyl_selection
  - id: ups-sine-wave
    category: ups
    content_type: useful
    title: Почему форма выходного сигнала ИБП важна для котла и насоса
    hook: "Купили ИБП, подключили котёл — а он пищит, ругается на питание и уходит в ошибку. Хотя ИБП исправен."
    intro: "Дело в форме сигнала на выходе. Технике с электроникой и мотором нужна синусоида, а не её ступенчатая имитация."
    offer: "В характеристиках ищите две строки: форму выходного напряжения и точность его поддержания. Для котла, насоса и серверного оборудования это важнее ёмкости батареи."
    cta: Напишите, что планируете запитать, — подскажем, хватит ли обычного ИБП или нужен Online.
    visual: "Фотореалистичный кадр в технической зоне частного дома: чёрный ИБП без узнаваемого бренда стоит на полу рядом с настенным газовым котлом, кабели уложены аккуратно, на панели ИБП горят индикаторы. Спокойный дневной свет, без людей, без текста, надписей и логотипов."
    facts:
      - id: online-always-sine
        text: У ИБП POWERMAN ONLINE 1000 RT форма выходного напряжения всегда синусоидальная.
        source: powerman_online
      - id: online-voltage-accuracy
        text: Выходное напряжение этой модели синусоидальное 220 В с точностью ±1 процент.
        source: powerman_online
      - id: online-input-window
        text: Модель работает от сети без перехода на батарею в диапазоне 115–295 В в зависимости от нагрузки.
        source: powerman_online
      - id: online-double-conversion
        text: ИБП построен по схеме двойного преобразования энергии, которая не требует времени на переключение питания сеть-батарея.
        source: powerman_online
  - id: ups-placement-and-ports
    category: ups
    content_type: useful
    title: Куда поставить ИБП и чем его подключать
    hook: "ИБП выбран по мощности, привезли — и выяснилось, что он не встаёт в стойку, а вилок на задней панели не хватает."
    intro: "Мощность решает не всё. Исполнение корпуса, тип разъёмов и способ управления определяют, встанет ли ИБП на своё место без переделок."
    offer: "До заказа проверьте три вещи: форм-фактор под ваше место, количество и тип розеток под вашу технику, и нужен ли вам удалённый мониторинг."
    cta: Опишите, где будет стоять ИБП и что к нему подключается, — подберём исполнение под место.
    visual: "Фотореалистичный кадр серверной ниши небольшого офиса: ИБП без узнаваемого бренда установлен в 19-дюймовую телекоммуникационную стойку, видны аккуратно подключённые кабели питания и патч-корды. Ровный технический свет, без людей, без текста, надписей и логотипов."
    facts:
      - id: rack-tower-form
        text: Исполнение корпуса RackTower позволяет установить ИБП в 19-дюймовую телекоммуникационную стойку.
        source: powerman_online
      - id: iec-outlets
        text: На модели предусмотрено восемь разъёмов нагрузки типа IEC 320.
        source: powerman_online
      - id: management-interfaces
        text: Для управления и мониторинга доступны интерфейсы USB, RS-232, SNMP и EPO.
        source: powerman_online
      - id: overload-bypass
        text: При перегрузке ИБП переходит в режим байпаса.
        source: powerman_online
      - id: sealed-batteries
        text: В модели применяются свинцово-кислотные герметичные необслуживаемые батареи.
        source: powerman_online
  - id: recuperator-condensate-and-build
    category: recuperators
    content_type: useful
    title: Что спросить про рекуператор кроме КПД
    hook: "Рекуператор выбрали по одной цифре — КПД. А через зиму под ним лужа, и никто не знает, куда её отводить."
    intro: "Рекуператор забирает тепло у тёплого влажного воздуха, и часть влаги неизбежно выпадает конденсатом. Куда он денется — вопрос конструкции, а не КПД."
    offer: "До заказа уточните три вещи: как устроен отвод конденсата, из чего корпус и теплообменник, и как до кассеты добираться на обслуживание."
    cta: Пришлите параметры помещения и требуемый воздухообмен — подберём установку вместе с отводом конденсата.
    visual: "Фотореалистичный кадр в техническом помещении частного дома: канальная приточно-вытяжная установка из оцинкованной стали смонтирована под потолком на подвесах, к ней подходят изолированные воздуховоды, снизу выведена дренажная трубка в сифон. Корпус приоткрыт, видна алюминиевая теплообменная кассета. Без людей, без текста, надписей и логотипов."
    facts:
      - id: zrp-drain-pan
        text: В рекуператорах серии ZRP предусмотрен съёмный дренажный поддон из оцинкованной стали.
        source: breez_zrp
      - id: zrp-drain-port
        text: Для отвода конденсата используется патрубок G1/2 с крепёжной гайкой.
        source: breez_zrp
      - id: zrp-casing
        text: Корпус выполнен из оцинкованной стали толщиной не менее 0,7 мм с фланцевыми соединениями.
        source: breez_zrp
      - id: zrp-cassette
        text: Теплообменная кассета собрана из алюминиевых пластин толщиной 0,2 мм специальной структуры и геометрии.
        source: breez_zrp
      - id: zrp-flow-separation
        text: При таком типе рекуперации происходит полное разделение воздушных потоков.
        source: breez_zrp
  - id: heat-pump-datasheet
    category: heat_pumps
    content_type: useful
    title: На что смотреть в паспорте теплового насоса кроме мороза
    hook: "Выбрали тепловой насос по нижней температуре — и получили ровно то, что просили. Вместе с гулом по ночам и счетами, которых не ждали."
    intro: "Мороз — только одна строка в паспорте. Рядом стоят ещё четыре, и они определяют, во сколько обойдётся эксплуатация и как вы будете спать."
    offer: "Смотрите класс энергоэффективности, тип компрессора, хладагент и шум внутреннего блока. Эти четыре строки говорят о ежедневной жизни с техникой больше, чем предельная температура."
    cta: Напишите площадь и назначение помещения — подберём серию по расчёту, а не по одной цифре на ценнике.
    visual: "Фотореалистичный кадр современной гостиной частного дома зимой: настенный внутренний блок сплит-системы работает на обогрев, за панорамным окном заснеженный двор, в комнате тепло и уютно. Спокойный вечерний свет, без людей, без текста, надписей и логотипов."
    facts:
      - id: heatforce-seasonal-class
        text: Для серии HeatForce заявлен класс сезонной энергоэффективности A+++ на охлаждение.
        source: daichi_heatforce
      - id: heatforce-compressor
        text: В серии применяется компрессор типа Full DC Inverter.
        source: daichi_heatforce
      - id: heatforce-refrigerant
        text: Оборудование серии работает на хладагенте R32.
        source: daichi_heatforce
      - id: heatforce-noise
        text: Уровень шума внутреннего блока составляет от 21 до 44 дБА в зависимости от модели.
        source: daichi_heatforce
      - id: heatforce-service-life
        text: Заявленный срок эксплуатации оборудования серии — 10 лет.
        source: daichi_heatforce
  - id: ups-outlets-not-equal
    category: ups
    content_type: useful
    title: Почему не все розетки на ИБП одинаковые
    hook: "Подключили к ИБП всё подряд, свет погас — а половина техники всё равно выключилась. Розетки на корпусе не равнозначны."
    intro: "У бытовых моделей часть розеток питается от батареи, а часть идёт только через сетевой фильтр. Вторые при отключении света мертвы, и об этом узнают в самый неподходящий момент."
    offer: "Перед установкой посчитайте, сколько розеток именно с батарейной поддержкой. Остальные годятся для зарядок и принтера, но не для котла или роутера."
    cta: Напишите, что нужно удержать при отключении света, — подскажем, сколько батарейных розеток вам хватит.
    visual: "Фотореалистичный кадр крупным планом: задняя панель бытового источника бесперебойного питания без узнаваемого бренда, видны ряды розеток и подключённые к части из них кабели. Оборудование стоит на полу у стены в жилой комнате. Без людей, без текста, надписей и логотипов."
    facts:
      - id: brick-outlet-split
        text: "У ИБП POWERMAN BRICK 600 шесть розеток Shuko: три от ИБП и три от сетевого фильтра."
        source: powerman_brick
      - id: brick-input-window
        text: Модель рассчитана на входное напряжение 220 В с отклонением до 25 процентов.
        source: powerman_brick
      - id: brick-battery-protection
        text: Предусмотрена защита батареи от глубокого разряда и перезаряда.
        source: powerman_brick
      - id: brick-charge-time
        text: Зарядка батареи ИБП POWERMAN BRICK 600 занимает 6–8 часов до 90 процентов полной ёмкости.
        source: powerman_brick
      - id: brick-indication
        text: Состояние показывают светодиоды «Сеть», «Батарея» и «Ошибка».
        source: powerman_brick
  - id: ac-noises-not-a-fault
    category: air_conditioners
    content_type: service
    title: Пять «поломок» кондиционера, которые поломками не являются
    hook: "Щёлкает панель, журчит вода, из решётки идёт лёгкий туман. Кажется, что техника сыпется, — а по руководству это штатная работа."
    intro: "Половина тревожных звонков в сервис заканчивается тем, что мастеру нечего чинить. Производитель прямо перечисляет такие симптомы в таблице неисправностей и объясняет их природу. Разберём, что можно спокойно игнорировать, а что действительно требует рук."
    offer: "Если ваш симптом в списке выше — просто промойте фильтр и понаблюдайте. Если его там нет, приезжаем на диагностику и говорим честно, нужен ремонт или нет."
    cta: Опишите в комментариях, что именно вас насторожило, — подскажем, это норма или повод вызвать мастера.
    visual: "Фотореалистичный кадр: настенный внутренний блок сплит-системы без узнаваемого бренда на светлой стене жилой комнаты, передняя панель приподнята, виден снятый пылезащитный фильтр в руках взрослого человека. Мягкий дневной свет из окна. Без текста, надписей и логотипов."
    facts:
      - id: manual-smell-filter
        text: Странный запах из кондиционера производитель связывает с загрязнением фильтра.
        source: daichi_service_manual
      - id: manual-water-noise
        text: Шум текущей воды объясняется перетеканием жидкости в контуре хладагента.
        source: daichi_service_manual
      - id: manual-light-mist
        text: Лёгкий туман у выходного отверстия бывает в режимах охлаждения и осушки, когда в помещении становится прохладно.
        source: daichi_service_manual
      - id: manual-panel-creak
        text: Скрип вызван расширением и сжатием передней панели из-за перепада температур и не является неисправностью.
        source: daichi_service_manual
      - id: manual-weak-airflow
        text: Слабый поток воздуха бывает при засорённом фильтре, перекрытых отверстиях блока или минимальной скорости вентилятора.
        source: daichi_service_manual
      - id: manual-protective-stop
        text: Работа иногда прекращается автоматически для защиты устройства, в том числе когда напряжение в сети выше или ниже допустимого диапазона.
        source: daichi_service_manual
  - id: ac-installation-checklist
    category: air_conditioners
    content_type: service
    title: "За что вы платите при монтаже кондиционера"
    hook: "«Кондиционер? Его же за два часа на кронштейны вешают.» Так и получаются компрессоры, которые умирают на второй сезон."
    intro: "Разница между дешёвой и нормальной установкой не в кронштейнах, а в получасе работы, которого не видно на готовой стене. Производитель прописал эти шаги в инструкции по монтажу — не как рекомендацию, а как условие исправной работы."
    offer: "Мы вакуумируем каждую трассу и проверяем соединения на утечку. Это не допуслуга в смете, а то, без чего гарантия не имеет смысла."
    cta: Спросите у любого монтажника, вакуумирует ли он трассу и сколько минут, — по ответу сразу видно уровень бригады.
    visual: "Фотореалистичный кадр: наружный блок сплит-системы без узнаваемого бренда на стене здания, к сервисному штуцеру подключён шланг вакуумного насоса, рядом на земле стоит сам насос и лежат гаечные ключи. Дневной свет, рабочая обстановка. Без людей крупным планом, без текста, надписей и логотипов."
    facts:
      - id: install-vacuum-why
        text: Воздух и влага, попавшие в контур хладагента, могут привести к неисправности компрессора.
        source: daichi_service_manual
      - id: install-vacuum-time
        text: Вакуумный насос запускают на 10–15 минут, пока не будет достигнут абсолютный вакуум 10 мм рт. ст.
        source: daichi_service_manual
      - id: install-leak-check
        text: После вакуумирования все соединения проверяют на утечку жидким мылом или электронным детектором.
        source: daichi_service_manual
      - id: install-torque-both-ways
        text: Утечка возможна и при недостаточном, и при чрезмерном моменте затяжки конусных гаек.
        source: daichi_service_manual
      - id: install-torque-wrench
        text: Самым надёжным способом затяжки инструкция называет работу обычным и динамометрическим ключами.
        source: daichi_service_manual
      - id: install-wall-seal
        text: Отверстие в стене под трубопровод закрывают уплотнителем, чтобы снаружи не проникали воздух и вода.
        source: daichi_service_manual
  - id: fresh-air-without-open-window
