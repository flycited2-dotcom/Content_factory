  - id: myth-ups-all-outlets
    format: myth
    category: ups
    content_type: useful
    title: Миф про розетки ИБП
    visual: "Крупный план задней панели современного ИБП на полке: в одну группу розеток воткнуты вилки роутера и зарядки, вторая группа розеток пустая, рядом работающий роутер с горящими индикаторами. Тёплый домашний вечерний свет. Современная реалистичная фотография, без людей, без текста, надписей и логотипов, не рисунок и не иллюстрация."
    body: |-
      Миф: «Воткнул технику в ИБП — и она под защитой».

      На деле у POWERMAN BRICK 600 шесть розеток, но от батареи работают только три. Остальные три идут через сетевой фильтр: при отключении света они гаснут.

      Роутер и котёл — в первую тройку. Принтер и зарядки — во вторую.

      Перепроверьте свой ИБП: куда сейчас воткнуто самое важное?
    facts:
      - id: myth-brick-split
        text: "У ИБП POWERMAN BRICK 600 шесть розеток Shuko: три от ИБП и три от сетевого фильтра."
        source: powerman_brick
  - id: myth-wide-range
    format: myth
    category: stabilizers
    content_type: comparison
    title: Миф про широкий диапазон стабилизатора
    visual: "Настенный стабилизатор напряжения без узнаваемого бренда в технической зоне частного дома, на цифровом дисплее виден показатель напряжения, рядом распределительный щит с автоматами. Ровный дневной свет. Современная реалистичная фотография, без людей, без текста, надписей и логотипов, не рисунок и не иллюстрация."
    body: |-
      Миф: «Чем шире диапазон входного напряжения, тем лучше стабилизатор».

      Взгляните на паспорт Штиль IS20000. Предельный входной диапазон у него 90–310 В. Но полную нагрузку он держит только от 165 до 310 В, а ниже выходная мощность ограничивается.

      Значит, при глубокой просадке сети вы получите стабильное напряжение, но не те киловатты, на которые рассчитывали.

      Какое напряжение у вас в розетке вечером? Если не замеряли, это первое, с чего стоит начать.
    facts:
      - id: myth-is20000-limit
        text: Для модели Штиль IS20000 указан предельный входной диапазон 90–310 В.
        source: shtyl_is20000
      - id: myth-is20000-full
        text: Полная нагрузка для этой модели доступна при входном напряжении 165–310 В, а ниже выходная мощность ограничивается.
        source: shtyl_is20000
  - id: myth-minus-thirty
    format: myth
    category: heat_pumps
    content_type: useful
    title: Миф про минус тридцать
    visual: "Наружный блок теплового насоса на фасаде частного дома зимним морозным утром: на корпусе иней, вокруг свежий снег, из-за крыши встаёт солнце. Чёткий холодный свет. Современная реалистичная фотография, без людей, без текста, надписей и логотипов, не рисунок и не иллюстрация."
    body: |-
      Миф: «В паспорте написано −30 °C — значит, греет одинаково хорошо и при −30, и при нуле».

      Цифра −30 °C у серии HeatForce говорит о том, до какого мороза установка работает. Сколько тепла она даст в этот мороз — вопрос другой.

      Поэтому мощность сверяют с теплопотерями дома при расчётной температуре, а не с самой красивой цифрой в буклете.

      Знаете, сколько тепла уходит из вашего дома в мороз? Если нет — это как раз то, что мы считаем.
    facts:
      - id: myth-minus-thirty-range
        text: Для серии HeatForce производитель заявляет работу на обогрев при наружной температуре до −30 °C.
        source: daichi_heatforce
      - id: myth-match-capacity
        text: Теплопроизводительность оборудования должна соответствовать теплопотерям помещения при расчётной температуре.
        source: daichi_heatforce
  - id: myth-instant-switch
    format: myth
    category: ups
    content_type: comparison
    title: Миф про мгновенное переключение ИБП
    visual: "Рабочий стол вечером: включённый ноутбук с открытым документом и небольшой чёрный ИБП с горящими зелёными индикаторами, за окном огни города. Уютный тёплый свет настольной лампы. Современная реалистичная фотография, без людей, без текста, надписей и логотипов, не рисунок и не иллюстрация."
    body: |-
      Миф: «Любой ИБП подхватывает нагрузку без единой паузы».

      У бытового POWERMAN BRICK 600 время переключения с сети на батарею — 2–4 мс. Для компьютера это незаметно. А вот у серии ONLINE переход нулевой.

      Разница нужна не всем. Но если вы защищаете сервер или автоматику, о ней стоит знать.

      Что вы хотите защитить: компьютер, котёл или что-то ответственное?
    facts:
      - id: myth-brick-switch
        text: Время переключения с сети на батарею у POWERMAN BRICK 600 составляет 2–4 мс.
        source: powerman_brick
      - id: myth-online-zero
        text: Для POWERMAN ONLINE заявлено нулевое время перехода с сети на батарею.
        source: powerman_online
  - id: myth-one-filter
    format: myth
    category: ventilation
    content_type: useful
    title: Миф про один фильтр в приточке
    visual: "Три разных воздушных фильтра для приточной установки выложены рядом на светлом рабочем столе: сетчатый, белый плиссированный тонкой очистки и чёрный угольный. Мягкий студийный свет, видна фактура материалов. Современная реалистичная фотография, без людей, без текста, надписей и логотипов, не рисунок и не иллюстрация."
    body: |-
      Миф: «В приточке стоит фильтр — значит, воздух чистый».

      Фильтр фильтру рознь. В BREZZA XS воздух проходит три ступени: сетчатый фильтр, механический тонкой очистки F7 и угольный. В моделях FUJI — предварительные фильтры G3 и HEPA 12.

      Когда выбираете приточку, спрашивайте не «есть ли фильтр», а «какой класс и сколько ступеней».

      А вы знаете, какой фильтр стоит в вашей вентиляции?
    facts:
      - id: myth-brezza-three-stage
        text: "В установке BREZZA XS применяется трёхступенчатая очистка: предварительный сетчатый фильтр, механический фильтр тонкой очистки F7 и угольный фильтр."
        source: breez_household_units
      - id: myth-fuji-hepa
        text: Модели FUJI комплектуются предварительными фильтрами G3 и фильтром HEPA 12.
        source: breez_household_units
  # ═══════════════ РУБРИКА «Цифра дня» ═══════════════
  - id: number-zeav-20db
    format: number
    category: ventilation
    content_type: useful
    title: Цифра дня — 20 дБ(А)
    visual: "Тихая спальня ночью: аккуратно застеленная кровать, над изголовьем на стене небольшая приточная установка, мягкий тёплый свет ночника, за окном тёмный двор. Современная реалистичная фотография, без людей, без текста, надписей и логотипов, не рисунок и не иллюстрация."
    body: |-
      Цифра дня: 20 дБ(А).

      Столько, по данным производителя, шумит приточка ZEAV 135 в ночном режиме, не больше. Это тише шёпота: установка, которую не слышно в спальне.

      Днём она тянет до 135 кубометров воздуха в час.

      Чувствительны ли вы к шуму по ночам? Расскажите в комментариях.
    facts:
      - id: number-zeav-noise
        text: В ночном режиме уровень шума модели ZEAV 135 составляет не более 20 дБ(А).
        source: breez_household_units
      - id: number-zeav-flow
        text: Производительность модели ZEAV 135 заявлена до 135 кубометров в час.
        source: breez_household_units
  - id: number-kochi-92
    format: number
    category: recuperators
    content_type: comparison
    title: Цифра дня — 92 процента
    visual: "Керамический сотовый теплообменник для приточной вентиляции лежит на рабочем столе монтажника рядом с рулеткой и перчатками, видна пористая структура. Мягкий дневной свет. Современная реалистичная фотография, без людей, без текста, надписей и логотипов, не рисунок и не иллюстрация."
    body: |-
      Цифра дня: 92 %.

      Столько тепла, по заявлению производителя, возвращает керамический теплообменник модели KOCHI. У пластинчатого в моделях FUJI — до 85 %.

      Семь пунктов разницы. Кажется, что немного, пока приточка работает всю зиму. Зато KOCHI ещё и тише: от 11 дБ(А).

      Что вам важнее — тишина или тепло? Пишите в комментариях.
    facts:
      - id: number-kochi-eff
        text: В модели KOCHI используется керамический теплообменник с эффективностью до 92 процентов.
        source: breez_household_units
      - id: number-fuji-eff
        text: В моделях FUJI применяется пластинчатый рекуператор с эффективностью до 85 процентов.
        source: breez_household_units
      - id: number-kochi-noise
        text: Уровень шума модели KOCHI начинается от 11 дБ(А).
        source: breez_household_units
  - id: number-heatforce-precision
    format: number
    category: air_conditioners
    content_type: useful
    title: Цифра дня — полградуса
    visual: "Современная светлая гостиная: на стене работает настенный кондиционер, на журнальном столике стоит цифровой термометр, уют и спокойный дневной свет из окна. Современная реалистичная фотография, без людей, без текста, надписей и логотипов, не рисунок и не иллюстрация."
    body: |-
      Цифра дня: ±0,5 °C.

      С таким отклонением, по заявлению производителя, инверторный кондиционер серии HeatForce держит заданную температуру. Обычный включается и выключается, и температура «пилит» вверх-вниз. Инвертор меняет обороты и стоит ровно.

      Именно это вы и чувствуете как «то жарко, то холодно» или «наконец комфортно».

      Какую температуру вы держите дома? Поделитесь в комментариях.
    facts:
      - id: number-heatforce-precision
        text: Для серии HeatForce заявлено поддержание заданной температуры с отклонением ±0,5 °C.
        source: daichi_heatforce
  - id: number-vacuum
    format: number
    category: air_conditioners
    content_type: service
    title: Цифра дня — 10–15 минут
    visual: "Крупный план манометрического коллектора со шлангами, подключёнными к сервисным портам наружного блока кондиционера, стрелки манометров, рядом вакуумный насос. Дневной свет на улице. Современная реалистичная фотография, без людей, без текста, надписей и логотипов, не рисунок и не иллюстрация."
    body: |-
      Цифра дня: 10–15 минут.

      Столько, по инструкции производителя, работает вакуумный насос при монтаже, пока в контуре не достигнут вакуум 10 мм рт. ст. Воздух и влага в контуре могут привести к неисправности компрессора.

      Поэтому, если монтажники закончили быстро и насос даже не доставали, это вопрос не цены, а ресурса кондиционера.

      Спросите у своей бригады: вакуумируют или нет? Ответ скажет всё.
    facts:
      - id: number-vacuum-time
        text: Вакуумный насос запускают на 10–15 минут, пока не будет достигнут абсолютный вакуум 10 мм рт. ст.
        source: daichi_service_manual
      - id: number-vacuum-why
        text: Воздух и влага, попавшие в контур хладагента, могут привести к неисправности компрессора.
        source: daichi_service_manual
  - id: number-brick-charge
    format: number
    category: ups
    content_type: useful
    title: Цифра дня — 6–8 часов
    visual: "Бытовой ИБП с горящими индикаторами заряда подключён к розетке у дивана в уютной гостиной, на соседнем столике светится роутер. Вечерний тёплый свет. Современная реалистичная фотография, без людей, без текста, надписей и логотипов, не рисунок и не иллюстрация."
    body: |-
      Цифра дня: 6–8 часов.

      Столько, по паспорту, заряжается батарея POWERMAN BRICK 600 до 90 % полной ёмкости. Значит, за ночь она почти полностью восстанавливается после отключения света.

      А ещё в ИБП предусмотрена защита батареи от глубокого разряда и перезаряда. Аккумулятор — самая дорогая и самая недолговечная часть, так что защита нужна не для галочки.

      Часто ли у вас пропадает свет? Напишите — оценим нужную ёмкость.
    facts:
      - id: number-brick-charge
        text: Зарядка батареи ИБП POWERMAN BRICK 600 занимает 6–8 часов до 90 процентов полной ёмкости.
        source: powerman_brick
      - id: number-brick-protect
        text: Предусмотрена защита батареи от глубокого разряда и перезаряда.
        source: powerman_brick
  # ═══════════════ РУБРИКА «Сезон» ═══════════════
  - id: season-heating-gap
    format: season
    category: heat_pumps
    content_type: useful
    title: Вечера холодные, отопление ещё не дали
    months: [10, 11]
    body: |-
      Вечера уже холодные, а батареи ещё не включили. Знакомо?

      Именно в такое межсезонье выручает инверторный тепловой насос типа воздух–воздух. Серия HeatForce, например, заявлена на обогрев при наружной температуре до −30 °C, так что осень для неё не проблема.

      Замену батареям он не составит, но закрыть вечера, пока тепла в доме нет, вполне способен.

      Напишите площадь комнаты, где мёрзнете, — посчитаем, хватит ли одного блока.
    visual: "Фотореалистичный кадр: уютная гостиная частного дома осенним вечером, за панорамным окном последние жёлтые листья, на стене работает настенный внутренний блок сплит-системы, на диване плед и кружка. Тёплый вечерний свет. Без людей, без текста, надписей и логотипов."
    facts:
      - id: season-heatforce-minus-thirty
        text: Для серии HeatForce производитель заявляет работу на обогрев при наружной температуре до −30 °C.
        source: daichi_heatforce
      - id: season-heatforce-air-to-air
        text: Серия HeatForce относится к тепловым насосам типа воздух–воздух.
        source: daichi_heatforce
  - id: season-blackout-router
    format: season
    category: ups
    content_type: useful
    title: Осень — время вспомнить про свет
    months: [10, 11, 12]
    body: |-
      Осень, темнеет рано — и в эти вечера особенно обидно, когда пропадает свет.

      Простое решение: ИБП, который держит на батарее самое нужное. У POWERMAN BRICK 600 от батареи работают три розетки из шести. Роутер, зарядка телефона и подсветка — уже неплохой набор, чтобы пережить перебой без темноты и без потери связи.

      Остальные три розетки — для того, что не критично.

      Что бы вы оставили на батарее в первую очередь?
    visual: "Фотореалистичный кадр: тёмный осенний вечер за окном, в комнате горит тёплая лампа, на столе работающий Wi-Fi роутер и небольшой чёрный ИБП с включёнными индикаторами. Уютная атмосфера. Без людей, без текста, надписей и логотипов."
    facts:
      - id: season-brick-split
        text: "У ИБП POWERMAN BRICK 600 шесть розеток Shuko: три от ИБП и три от сетевого фильтра."
        source: powerman_brick
  - id: season-closed-windows
    format: season
    category: ventilation
    content_type: useful
    title: Окна закрыли на зиму
    months: [10, 11, 12, 1, 2]
    body: |-
      Окна закрыли на зиму, и к вечеру в комнате стоит тяжёлый воздух.

      Проветривать в мороз — значит выпускать тепло на улицу. Приточка с рекуперацией отбирает тепло у вытяжного воздуха и передаёт его свежему. Пластинчатый рекуператор в моделях FUJI работает с эффективностью до 85 %, керамический в KOCHI — до 92 %.

      Свежий воздух без холода и без гудения окна на проветривании.

      Как вы проветриваете зимой? Напишите — расскажем, как делать это без потерь.
    visual: "Фотореалистичный кадр: зимний вечер, за плотно закрытым окном снег и уличный фонарь, в тёплой комнате на стене компактная приточная установка, на подоконнике комнатные растения. Мягкий тёплый свет. Без людей, без текста, надписей и логотипов."
    facts:
      - id: season-fuji-efficiency
        text: В моделях FUJI применяется пластинчатый рекуператор с эффективностью до 85 процентов.
        source: breez_household_units
      - id: season-kochi-efficiency
        text: В модели KOCHI используется керамический теплообменник с эффективностью до 92 процентов.
        source: breez_household_units
      - id: season-heat-recovery
        text: Пластинчатый рекуператор утилизирует тепло или холод в системе вентиляции.
        source: breez_zrp
  - id: season-outdoor-unit-site
    format: season
    category: heat_pumps
    content_type: useful
    title: Где поставить наружный блок до зимы
    months: [10, 11]
    body: |-
      Хотите тепловой насос к зиме? Начните не с модели, а с места.

      До выбора проверяют, где встанет наружный блок, какая допустимая длина трассы и как отвести конденсат. Ошибиться здесь проще, чем кажется, а переделать после монтажа уже сложно.

      Поэтому лучше сначала пройтись по дому и участку, а потом выбирать оборудование.

      Пришлите фото стены, где планируете блок, — подскажем, подходит ли она.
    visual: "Фотореалистичный кадр: осенний двор частного дома, на кирпичной стене стоит наружный блок сплит-системы без узнаваемого бренда на кронштейнах, вокруг свободное место, рядом жёлтые листья. Дневной свет. Без людей, без текста, надписей и логотипов."
    facts:
      - id: season-install-conditions
        text: До выбора проверяют место наружного блока, допустимую длину трассы и возможность отвода конденсата.
        source: daichi_heatforce
  # ═══════════════ РУБРИКА «Вопрос-опрос» ═══════════════
  - id: poll-blackout-first
    format: poll
    category: ups
    content_type: useful
    title: Что выключается первым при отключении света
    visual: "Тёмная квартира вечером во время отключения света: на столе горит свеча, рядом работающий от ИБП роутер с зелёными индикаторами, за окном тёмный двор. Современная реалистичная фотография, без людей, без текста, надписей и логотипов, не рисунок и не иллюстрация."
    body: |-
      Вопрос недели: что у вас гаснет первым, когда пропадает свет?

      А. Роутер — и связи нет.
      Б. Котёл — и холодает.
      В. Холодильник.
      Г. Ничего, у нас всё на батарее.

      Пишите букву в комментариях. А мы расскажем, что подключить к ИБП в первую очередь: у бытовых моделей вроде POWERMAN BRICK 600 от батареи работают три розетки из шести, так что выбирать есть из чего.
    facts:
      - id: poll-brick-split
        text: "У ИБП POWERMAN BRICK 600 шесть розеток Shuko: три от ИБП и три от сетевого фильтра."
        source: powerman_brick
  - id: poll-ac-noise-sleep
    format: poll
    category: air_conditioners
    content_type: useful
    title: Как вы спите — с кондиционером или без
    visual: "Спальня глубокой ночью: на стене тихо работает кондиционер со слабым индикатором, кровать с одеялом, приглушённый тёплый полумрак. Современная реалистичная фотография, без людей, без текста, надписей и логотипов, не рисунок и не иллюстрация."
    body: |-
      Вопрос: вы спите со включённым кондиционером?

      А. Да, иначе жарко.
      Б. Иногда, на самый тихий режим.
      В. Нет, мешает шум.

      Кстати, шум — не мелочь. У внутренних блоков серии HeatForce он составляет от 21 до 44 дБА в зависимости от модели, и такой разброс на слух очень заметен.

      Пишите букву в комментариях, а мы расскажем, на какой модели спится тише.
    facts:
      - id: poll-heatforce-noise
        text: Уровень шума внутреннего блока составляет от 21 до 44 дБА в зависимости от модели.
        source: daichi_heatforce
