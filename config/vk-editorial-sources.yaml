  # ═══════════════ РУБРИКА «Вопрос из чата» ═══════════════
  - id: qa-ac-water-noise
    format: qa
    category: air_conditioners
    content_type: service
    title: Кондиционер журчит, как чайник
    visual: "Взрослый человек стоит у стены жилой комнаты и держит в руках снятый пылезащитный фильтр от настенного внутреннего блока кондиционера без узнаваемого бренда, блок с приподнятой панелью виден на стене. Тёплый дневной свет. Современная реалистичная фотография, без людей, без текста, надписей и логотипов, не рисунок и не иллюстрация."
    body: |-
      — Кондиционер журчит, как чайник. Он сломался?

      Нет, это нормально. Производитель прямо объясняет: шум текущей воды — это перетекание жидкости в контуре хладагента.

      А вот запах — уже повод заглянуть под панель. В таблице неисправностей причиной назван загрязнённый фильтр. Снимите его и промойте водой. Если на нём жирный налёт, вода должна быть тёплой, но не горячее 45 °C. Сушить — в прохладном сухом месте.

      Слышите какой-то другой звук? Опишите в комментариях, скажем, норма это или пора вызывать мастера.
    facts:
      - id: qa-water-noise
        text: Шум текущей воды объясняется перетеканием жидкости в контуре хладагента.
        source: daichi_service_manual
      - id: qa-smell-filter
        text: Странный запах из кондиционера производитель связывает с загрязнением фильтра.
        source: daichi_service_manual
      - id: qa-warm-water
        text: Если на фильтре есть масло, для промывки используют тёплую воду не более 45 °C.
        source: daichi_service_manual
      - id: qa-dry-cool-place
        text: После промывки фильтр сушат в прохладном сухом месте.
        source: daichi_service_manual
  - id: qa-ac-mist
    format: qa
    category: air_conditioners
    content_type: service
    title: Из кондиционера идёт туман
    visual: "Настенный внутренний блок кондиционера без узнаваемого бренда в жилой комнате в жаркий день, из выходной решётки идёт едва заметная лёгкая дымка охлаждённого воздуха, на переднем плане стакан с холодной водой на подоконнике. Мягкий свет. Современная реалистичная фотография, без людей, без текста, надписей и логотипов, не рисунок и не иллюстрация."
    body: |-
      — Из кондиционера пошёл лёгкий туман. Что-то горит?

      Успокойтесь, это не дым. Производитель описывает это явление сам: лёгкий туман у выходного отверстия бывает в режимах охлаждения и осушки, когда в комнате становится прохладно.

      Есть и ещё один «звук без повода»: скрип передней панели. Он появляется из-за расширения и сжатия пластика при перепадах температуры и неисправностью не считается.

      Что ещё вас насторожило в работе кондиционера? Напишите — разберём.
    facts:
      - id: qa-light-mist
        text: Лёгкий туман у выходного отверстия бывает в режимах охлаждения и осушки, когда в помещении становится прохладно.
        source: daichi_service_manual
      - id: qa-panel-creak
        text: Скрип вызван расширением и сжатием передней панели из-за перепада температур и не является неисправностью.
        source: daichi_service_manual
  - id: qa-ups-boiler
    format: qa
    category: ups
    content_type: useful
    title: Почему котёл ругается на ИБП
    visual: "Настенный газовый котёл в технической зоне частного дома, на его дисплее горит индикатор ошибки, рядом на полу стоит чёрный ИБП с включёнными индикаторами. Спокойный дневной свет. Современная реалистичная фотография, без людей, без текста, надписей и логотипов, не рисунок и не иллюстрация."
    body: |-
      — Подключил котёл к ИБП, а он пищит и уходит в ошибку. ИБП плохой?

      Чаще дело не в качестве, а в форме напряжения. У бытового POWERMAN BRICK 600 на выходе модифицированная синусоида 220 В ±10 %. Для компьютера и роутера этого достаточно, а вот электроника котла может быть к форме напряжения требовательнее.

      У серии ONLINE иначе: у POWERMAN ONLINE 1000 RT выходное напряжение всегда синусоидальное, с точностью ±1 %.

      Что говорит паспорт вашего котла про питание? Пришлите модель — подскажем, какой класс ИБП брать.
    facts:
      - id: qa-brick-modified-sine
        text: У ИБП POWERMAN BRICK 600 выходное напряжение — модифицированная синусоида 220 В ±10 %.
        source: powerman_brick
      - id: qa-online-sine
        text: Выходное напряжение POWERMAN ONLINE 1000 RT всегда синусоидальное, 220 В с точностью ±1 процент.
        source: powerman_online
  - id: qa-stabilizer-trips
    format: qa
    category: stabilizers
    content_type: useful
    title: Почему стабилизатор уходит в защиту
    visual: "Напольный стабилизатор напряжения без узнаваемого бренда стоит у стены рядом с распределительным щитом, на дисплее горит индикатор защиты. Спокойный дневной свет в техническом помещении частного дома. Современная реалистичная фотография, без людей, без текста, надписей и логотипов, не рисунок и не иллюстрация."
    body: |-
      — Сложил мощности всех приборов, взял стабилизатор ровно на эту цифру. А он то и дело отключается. Почему?

      Потому что паспортная мощность — это не всё. У некоторых приборов при включении пусковые токи превышают штатные в несколько раз. Холодильник, насос, кондиционер стартуют с рывка, и стабилизатор «впритык» этого рывка не тянет.

      Поэтому к расчётной мощности добавляют запас 20–30 процентов, чтобы стабилизатор не работал на пределе.

      Какие приборы у вас включаются тяжелее всего? Напишите список — прикинем нужный запас.
    facts:
      - id: qa-startup-currents
        text: Отдельным категориям оборудования характерны высокие пусковые токи, превышающие штатные в несколько раз.
        source: shtyl_selection
      - id: qa-power-reserve
        text: К расчётной мощности обычно добавляют запас 20–30 процентов, чтобы стабилизатор не работал на пределе.
        source: shtyl_selection
  - id: qa-recuperator-drain
    format: qa
    category: recuperators
    content_type: useful
    title: Откуда вода у рекуператора
    visual: "Канальная приточно-вытяжная установка из оцинкованной стали смонтирована под потолком технического помещения, от её дренажного патрубка идёт трубка в сифон, видны изолированные воздуховоды. Спокойный дневной свет. Современная реалистичная фотография, без людей, без текста, надписей и логотипов, не рисунок и не иллюстрация."
    body: |-
      — Поставили рекуператор, а из него капает вода. Брак?

      Не брак, а физика. Когда тёплый воздух из комнаты остывает в теплообменнике, влага превращается в конденсат. Поэтому в рекуператорах серии ZRP есть съёмный дренажный поддон из оцинкованной стали и патрубок G1/2 для отвода воды.

      Значит, при монтаже важен не только воздуховод, но и слив: его нужно продумать заранее, до того как всё зашито в потолок.

      Где у вас планируется установка? Напишите, и мы подскажем, куда выводить конденсат.
    facts:
      - id: qa-drain-pan
        text: В рекуператорах серии ZRP предусмотрен съёмный дренажный поддон из оцинкованной стали.
        source: breez_zrp
      - id: qa-drain-port
        text: Для отвода конденсата используется патрубок G1/2 с крепёжной гайкой.
        source: breez_zrp
