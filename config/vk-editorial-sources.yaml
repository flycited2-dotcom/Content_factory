    hook: "Тополиный пух, пыль с дороги и шум машин. Форточка приносит свежий воздух вместе со всем этим, поэтому её чаще держат закрытой."
    intro: "Отсюда и духота к вечеру: воздух в квартире не меняется вообще. Приточная установка решает ровно эту задачу — берёт воздух с улицы, прогоняет его через фильтры и подаёт уже очищенным и подогретым, при закрытых окнах."
    offer: "Установка ставится в стену за один выезд и не требует переделки вентиляции. Посчитаем производительность под вашу площадь и число жильцов."
    cta: Напишите площадь квартиры и сколько человек в ней живёт — назовём подходящую производительность.
    visual: "Фотореалистичный интерьерный кадр жилой комнаты городской квартиры, снятый изнутри. Кадр обязан одновременно содержать три вещи: плотно закрытое окно, за стеклом — оживлённую городскую улицу с дорогой и тополиным пухом в воздухе, и компактную настенную приточную установку без узнаваемого бренда на стене рядом с окном, примерно в полуметре от откоса. В комнате чисто, спокойно и уютно, видна обстановка: подоконник, штора, часть дивана или стола. Мягкий дневной свет. Запрещены студийный кадр оборудования на белом фоне, вид только прибора без интерьера и окна, открытая форточка, инфографика, стрелки, схемы, подписи, текст и логотипы."
